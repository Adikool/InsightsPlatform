[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insight-platform"
version = "0.1.0"
description = "Connector -> NLP -> Superset -> data-science platform"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "duckdb>=0.10",
    "sqlalchemy>=2.0",
    "pydantic>=2.5",
    "requests>=2.31",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.3", "scipy>=1.11"]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
postgres = ["psycopg[binary]>=3.1"]
mssql = ["pyodbc>=5.0"]
all = [
    "scikit-learn>=1.3", "scipy>=1.11",
    "fastapi>=0.110", "uvicorn>=0.27",
    "psycopg[binary]>=3.1",
    "pyodbc>=5.0",
]

[project.scripts]
insight = "dataplatform.cli:main"

[tool.setuptools.packages.find]
include = ["dataplatform*"]

[tool.setuptools.package-data]
dataplatform = ["api/static/*"]
